name: build
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --windowed --name PuzzlemakerStudio --icon=puzzlemaker.ico --add-data "puzzlemaker.ico;." main.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/PuzzlemakerStudio.exe
